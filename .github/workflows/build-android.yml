name: Build Android APK & AAB

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smartstudy-ai-mobile-app/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./smartstudy-ai-mobile-app
        run: npm ci

      - name: Setup release keystore
        working-directory: ./smartstudy-ai-mobile-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "RELEASE_KEYSTORE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "No keystore configured, using debug signing"
            echo "RELEASE_KEYSTORE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Build APK (Release signed if keystore available)
        working-directory: ./smartstudy-ai-mobile-app/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$RELEASE_KEYSTORE_EXISTS" = "true" ]; then
            ./gradlew assembleRelease \
              -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
              -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo "Building with debug keystore (no release keystore configured)"
            ./gradlew assembleRelease
          fi

      - name: Build AAB (App Bundle)
        working-directory: ./smartstudy-ai-mobile-app/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$RELEASE_KEYSTORE_EXISTS" = "true" ]; then
            ./gradlew bundleRelease \
              -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
              -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew bundleRelease
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartstudy-apk
          path: smartstudy-ai-mobile-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartstudy-aab
          path: smartstudy-ai-mobile-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            smartstudy-ai-mobile-app/android/app/build/outputs/apk/release/*.apk
            smartstudy-ai-mobile-app/android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
